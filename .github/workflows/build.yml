name: Build, test, and publish
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    name: Specifications and 95% unit coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate specifications
        env:
          OPENSPEC_TELEMETRY: '0'
        run: npm run spec:validate
      - run: python -m pip install -r tests/requirements.txt
      - name: Coverage gate self-tests
        run: python -m unittest discover -s tests -p 'test_quality_tools.py'
      - name: Unit coverage gate
        run: python scripts/check-coverage.py
      - name: Complete expeditions and sanctuary journey
        run: ctest --test-dir build-coverage -L gameplay --output-on-failure
      - name: Core sanitizers
        run: |
          cmake -S . -B build-sanitize -DSC_BUILD_GAME=OFF -DSC_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-sanitize --parallel 4
          ctest --test-dir build-sanitize --output-on-failure
      - name: Retain coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: build-coverage/coverage
          if-no-files-found: ignore
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Linux render smoke test
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
          EGL_PLATFORM: surfaceless
        run: |
          ./build/starship_crawl --seed 713 --smoke 10 --no-save
          ./build/starship_crawl --seed 713 --scene guardian --split --smoke 60 --no-save
          ./build/starship_crawl --seed 713 --scene shelter --split --smoke 60 --no-save
          ./build/starship_crawl --seed 713 --scene matrix --split --smoke 60 --no-save
          ./build/starship_crawl --seed 713 --scene form4 --split --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene mech --split --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene wagon --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene landmark3 --split --smoke 30 --no-save
          ./build/starship_crawl --seed 22 --scene origin --split --smoke 30 --no-save
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: |
            build/starship_crawl
            build/Release/starship_crawl.exe
  web:
    # Keep Playwright's system packages stable during hosted-runner migrations.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Emscripten SDK
        run: |
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
      - name: Build WebGL 2 application
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-web --parallel 4
      - name: Native generator reference
        run: |
          cmake -S . -B build-parity -DSC_BUILD_GAME=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-parity --parallel 4
          ctest --test-dir build-parity --output-on-failure
      - name: Python browser tooling
        run: python -m pip install -r tests/requirements.txt
      - name: Browser dependencies
        run: |
          if ! python -m playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1; then
            cat "$RUNNER_TEMP/browser-install.log"
            python - <<'PY'
          import os
          from pathlib import Path
          detail = (Path(os.environ['RUNNER_TEMP']) / 'browser-install.log').read_text()[-4000:]
          print('::error title=Browser dependency installation::' + detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit 1
          fi
      - name: Package the Pages site
        run: python scripts/package-web.py --output build-pages-preview/starship_crawl
      - name: Play ship matrix links, programs, controllers and safe return
        run: |
          if ! python tests/test_matrix_browser.py --site-dir build-pages-preview --url-path /starship_crawl/ > "$RUNNER_TEMP/matrix-browser.log" 2>&1; then
            cat "$RUNNER_TEMP/matrix-browser.log"
            python - <<'PYERROR'
          import os
          from pathlib import Path
          detail = (Path(os.environ['RUNNER_TEMP']) / 'matrix-browser.log').read_text()[-10000:]
          print('::error title=Ship matrix browser test::' + detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYERROR
            exit 1
          fi
          cat "$RUNNER_TEMP/matrix-browser.log"
      - name: Test the deployed URL structure
        env:
          SC_CORE_TEST: build-parity/sc_tests
        run: python tests/test_browser.py --site-dir build-pages-preview --url-path /starship_crawl/
      - name: Play sanctuary recovery and return
        run: python tests/test_shelter_browser.py --site-dir build-pages-preview --url-path /starship_crawl/
      - name: Play phase rewards, loadouts, guardian retry and fresh characters
        run: python tests/test_phases_browser.py --site-dir build-pages-preview --url-path /starship_crawl/
      - name: Play navigation, body variants and psionics
        run: python tests/test_features_browser.py --site-dir build-pages-preview --url-path /starship_crawl/
      - name: Play fold rigs, beams and flare lighting
        run: python tests/test_equipment_browser.py --site-dir build-pages-preview --url-path /starship_crawl/
      - name: Explore generated interiors and discoveries
        run: python tests/test_interiors_browser.py --site-dir build-pages-preview --url-path /starship_crawl/
      - name: Play generated histories, dossiers and decisions
        run: python tests/test_story_browser.py --site-dir build-pages-preview --url-path /starship_crawl/
      - name: Play reactive factions, debriefs and continuing stories
        run: python tests/test_aftermath_browser.py --site-dir build-pages-preview --url-path /starship_crawl/
      - name: Play enemy deaths, machines and avoidable traps
        run: python tests/test_deaths_browser.py --site-dir build-pages-preview --url-path /starship_crawl/
      - name: Retain browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-captures
          path: build-web/test-artifacts
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            build-web/starship_crawl.html
            build-web/starship_crawl.js
            build-web/starship_crawl.wasm
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-pages-preview/starship_crawl
  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [web, native, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the tested game
        id: deployment
        uses: actions/deploy-pages@v4
