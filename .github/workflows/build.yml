name: Build, test, and publish
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    name: Specifications and 95% unit coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate specifications
        env:
          OPENSPEC_TELEMETRY: '0'
        run: npm run spec:validate
      - run: python -m pip install -r tests/requirements.txt
      - name: Coverage gate self-tests
        run: python -m unittest discover -s tests -p 'test_quality_tools.py'
      - name: Unit coverage gate
        run: python scripts/check-coverage.py
      - name: Complete solo expedition
        run: ctest --test-dir build-coverage -L gameplay --output-on-failure
      - name: Core sanitizers
        run: |
          cmake -S . -B build-sanitize -DSC_BUILD_GAME=OFF -DSC_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-sanitize --parallel 4
          ctest --test-dir build-sanitize --output-on-failure
      - name: Retain coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: build-coverage/coverage
          if-no-files-found: ignore
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Linux render smoke test
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
          EGL_PLATFORM: surfaceless
        run: ./build/starship_crawl --seed 713 --smoke 10 --no-save
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: |
            build/starship_crawl
            build/Release/starship_crawl.exe
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Emscripten SDK
        run: |
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
      - name: Build WebGL 2 application
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-web --parallel 4
      - name: Native generator reference
        run: |
          cmake -S . -B build-parity -DSC_BUILD_GAME=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-parity --parallel 4
          ctest --test-dir build-parity --output-on-failure
      - name: Browser dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Package the Pages site
        run: python scripts/package-web.py --output build-pages-preview/starship_crawl
      - name: Test the deployed URL structure
        env:
          SC_CORE_TEST: build-parity/sc_tests
        run: python tests/test_browser.py --site-dir build-pages-preview --url-path /starship_crawl/
      - name: Retain browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-captures
          path: build-web/test-artifacts
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            build-web/starship_crawl.html
            build-web/starship_crawl.js
            build-web/starship_crawl.wasm
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-pages-preview/starship_crawl
  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [web, native, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the tested game
        id: deployment
        uses: actions/deploy-pages@v4
