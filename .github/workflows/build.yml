name: Build, test, and publish
run-name: >-
  ${{ inputs.extended_tests && 'Build with extended tests' || 'Build' }} — ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'publish Pages' || 'no Pages (requires main)' }} — ${{ github.ref_name }}
on:
  # Every push builds all targets and publishes after the fast checks pass.
  # Keep this unfiltered by paths so documentation/configuration commits run too.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extended_tests:
        description: Run extended tests (coverage, sanitizers, gameplay, browsers)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  quality:
    name: Fast specifications and tooling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate specifications
        env:
          OPENSPEC_TELEMETRY: '0'
        run: npm run spec:validate
      - run: python -m pip install pycparser==3.0
      - name: Coverage and CI gate self-tests
        run: |
          python scripts/generate-snapshot-schema.py --check
          python -m unittest discover -s tests -p 'test_quality_tools.py'
          python -m unittest discover -s tests -p 'test_ci_tools.py'
          python scripts/run-ci-tests.py browser --check
  coverage:
    name: Extended 95% unit coverage
    if: github.event_name == 'workflow_dispatch' && inputs.extended_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.test-matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r tests/requirements.txt
      - name: Unit-only coverage gate
        run: python scripts/check-coverage.py --quest --split-campaigns
      - name: Retain unit-only coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: build-coverage/coverage
          if-no-files-found: ignore
      - name: Package instrumented campaign executables
        id: test-matrix
        run: |
          python scripts/run-ci-tests.py ctest --build-dir build-coverage --label gameplay --check
          python scripts/run-ci-tests.py ctest --build-dir build-coverage --label gameplay --matrix >> "$GITHUB_OUTPUT"
          tar -czf ci-tests.tgz build-coverage/CTestTestfile.cmake build-coverage/sc_*
      - uses: actions/upload-artifact@v4
        with:
          name: ci-coverage-tests
          path: ci-tests.tgz
          compression-level: 0
          retention-days: 7
  sanitizer-build:
    name: Build core sanitizer tests
    if: github.event_name == 'workflow_dispatch' && inputs.extended_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build unchanged address, undefined-behavior and leak checks
        run: |
          cmake -S . -B build-sanitize -DSC_BUILD_GAME=OFF -DSC_QUEST_TESTS=ON -DSC_SPLIT_CAMPAIGN_TESTS=ON -DSC_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug '-DCMAKE_C_FLAGS_DEBUG=-O1 -g'
          cmake --build build-sanitize --parallel 4
          python scripts/run-ci-tests.py ctest --build-dir build-sanitize --check
          tar -czf ci-tests.tgz build-sanitize/CTestTestfile.cmake build-sanitize/sc_*
      - uses: actions/upload-artifact@v4
        with:
          name: ci-sanitize-tests
          path: ci-tests.tgz
          compression-level: 0
          retention-days: 7
  instrumented:
    name: ${{ matrix.mode }} / ${{ matrix.shard }}
    if: github.event_name == 'workflow_dispatch' && inputs.extended_tests
    needs: [coverage, sanitizer-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        mode: [coverage, sanitize]
        shard: ${{ fromJSON(needs.coverage.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-${{ matrix.mode }}-tests
      - name: Run every assigned instrumented case
        shell: bash
        run: |
          tar -xzf ci-tests.tgz
          ci_label_args=()
          if [[ '${{ matrix.mode }}' == 'coverage' ]]; then
            ci_label_args=(--label gameplay)
          fi
          python scripts/run-ci-tests.py ctest --build-dir 'build-${{ matrix.mode }}' --shard '${{ matrix.shard }}' "${ci_label_args[@]}"
      - name: Retain instrumented diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-${{ matrix.mode }}-${{ matrix.shard }}
          path: |
            build-${{ matrix.mode }}/shard-tests.xml
            build-${{ matrix.mode }}/Testing/Temporary/LastTest.log
            build-${{ matrix.mode }}/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
  native:
    name: Native / ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Configure target and optional test executables
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=${{ inputs.extended_tests && 'ON' || 'OFF' }}
      - run: cmake --build build --config Release --parallel 4
      - name: Full native unit and gameplay tests
        if: inputs.extended_tests
        run: ctest --test-dir build -C Release --output-on-failure --output-junit native-tests.xml
      - name: Report native test failures
        if: failure() && inputs.extended_tests
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('build/native-tests.xml')
          if report.is_file():
              for case in ET.parse(report).iter('testcase'):
                  if case.find('failure') is not None or case.find('error') is not None:
                      detail = case.get('name', 'Native test') + '\n' + (case.findtext('system-out') or '')[-10000:]
                      detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Native test failure::' + detail)
      - name: Linux startup smoke test
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
          EGL_PLATFORM: surfaceless
        run: ./build/starship_crawl --seed 713 --smoke 10 --no-save
      - name: Extended Linux rendering scenes
        if: runner.os == 'Linux' && inputs.extended_tests
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
          EGL_PLATFORM: surfaceless
        run: |
          ./build/starship_crawl --seed 713 --scene volume1 --smoke 60 --no-save
          ./build/starship_crawl --seed 713 --scene volume2 --split --smoke 60 --no-save
          ./build/starship_crawl --seed 713 --scene biome1 --split --smoke 60 --no-save
          ./build/starship_crawl --seed 713 --scene tentacles --split --smoke 100 --no-save
          ./build/starship_crawl --seed 713 --scene relay --split --smoke 60 --no-save
          ./build/starship_crawl --seed 713 --scene reveal2 --smoke 60 --no-save
          ./build/starship_crawl --seed 713 --scene front4 --split --smoke 60 --no-save
          ./build/starship_crawl --seed 713 --scene alien4 --smoke 60 --no-save
          ./build/starship_crawl --seed 713 --scene local4 --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene biome11 --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene stairs --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene ramp --split --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene lift --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene hull --smoke 20 --no-save
          ./build/starship_crawl --seed 713 --scene skiff --smoke 20 --no-save
          ./build/starship_crawl --seed 713 --scene cabin --split --smoke 20 --no-save
          ./build/starship_crawl --seed 713 --scene court0 --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene court1 --split --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene court2 --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene guardian --split --smoke 60 --no-save
          ./build/starship_crawl --seed 713 --scene shelter --split --smoke 60 --no-save
          ./build/starship_crawl --seed 713 --scene matrix --split --smoke 60 --no-save
          ./build/starship_crawl --seed 713 --scene form4 --split --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene mech --split --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene wagon --smoke 30 --no-save
          ./build/starship_crawl --seed 713 --scene landmark3 --split --smoke 30 --no-save
          ./build/starship_crawl --seed 22 --scene origin --split --smoke 30 --no-save
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: |
            build/starship_crawl
            build/Release/starship_crawl.exe
  web:
    name: Build ordinary WebGL target
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      suites: ${{ steps.test-matrix.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - name: Require every ordinary browser suite in the matrix
        id: test-matrix
        run: python scripts/run-ci-tests.py browser --matrix >> "$GITHUB_OUTPUT"
      - name: Explain Pages publishing target
        env:
          SC_EVENT_NAME: ${{ github.event_name }}
          SC_REF: ${{ github.ref }}
          SC_EXTENDED_TESTS: ${{ inputs.extended_tests || false }}
        run: |
          if [[ "$SC_EVENT_NAME" != "pull_request" && "$SC_REF" == "refs/heads/main" ]]; then
            echo 'Pages publishes after all target builds, fast tooling checks and any selected extended tests pass.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'All targets build on this branch. Pages publishes from main only.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Extended tests selected: $SC_EXTENDED_TESTS. Enable them with Run workflow → Run extended tests." >> "$GITHUB_STEP_SUMMARY"
      - name: Pinned Emscripten SDK
        run: |
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
      - name: Build and package the ordinary application once
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-web --parallel 4
          python scripts/package-web.py --output build-pages-preview/starship_crawl
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            build-web/starship_crawl.html
            build-web/starship_crawl.js
            build-web/starship_crawl.wasm
      - name: Retain the exact site for browser tests and Pages
        uses: actions/upload-artifact@v4
        with:
          name: pages-ordinary
          path: build-pages-preview/starship_crawl
          include-hidden-files: true
  web-browser:
    name: Web browser / ${{ matrix.suite }}
    if: github.event_name == 'workflow_dispatch' && inputs.extended_tests
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.web.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pages-ordinary
          path: build-pages-preview/starship_crawl
      - name: Build only the native browser reference helpers
        if: matrix.suite == 'arrival' || matrix.suite == 'story'
        run: |
          cmake -S . -B build-parity -DSC_BUILD_GAME=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-parity --target sc_tests sc_matrix_journey --parallel 4
      - name: Pinned browser tooling
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PYBROWSER'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as browser:
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write('SC_BROWSER=' + browser.chromium.executable_path + '\n')
          PYBROWSER
      - name: Run all assigned browser suites
        env:
          SC_CORE_TEST: build-parity/sc_tests
          SC_MATRIX_JOURNEY: build-parity/sc_matrix_journey
        run: python scripts/run-ci-tests.py browser --shard '${{ matrix.suite }}' --site-dir build-pages-preview --url-path /starship_crawl/
      - name: Retain captures, full logs and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-captures-${{ matrix.suite }}
          path: build-web/test-artifacts
          if-no-files-found: ignore
  quest:
    name: Standalone Quest WebXR target
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Emscripten SDK
        run: |
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
      - name: Build separate Quest and ordinary browser artifacts
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-quest -DSC_BUILD_QUEST=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-quest --parallel 4
          python scripts/package-web.py --build-dir build-quest --output build-quest-preview/starship_crawl
          python scripts/package-quest.py --output build-quest-preview/starship_crawl/quest
      - name: Packaging isolation checks
        run: python -m unittest discover -s tests -p 'test_quest_packaging.py'
      - name: Browser tooling
        if: inputs.extended_tests
        run: |
          python -m pip install -r tests/requirements-quest.txt
          python -m playwright install --with-deps chromium
      - name: Stereo WebGL, controller gameplay, lifecycle and save isolation
        if: inputs.extended_tests
        run: |
          python scripts/run-browser-test.py tests/test_quest_browser.py --site-dir build-quest-preview --url-path /starship_crawl/quest/
          python scripts/run-browser-test.py tests/test_guardians_browser.py --site-dir build-quest-preview --url-path /starship_crawl/quest/ --quest
          python scripts/run-browser-test.py tests/test_chronicle_browser.py --site-dir build-quest-preview --url-path /starship_crawl/quest/ --quest
      - name: Retain Quest captures and test results
        if: always() && inputs.extended_tests
        uses: actions/upload-artifact@v4
        with:
          name: quest-test-captures
          path: build-quest/test-artifacts
          if-no-files-found: ignore
      - name: Downloadable Quest build
        uses: actions/upload-artifact@v4
        with:
          name: quest-webxr
          path: build-quest-preview/starship_crawl/quest
          include-hidden-files: true
      - name: Retain Quest Pages subdirectory
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pages-quest
          path: build-quest-preview/starship_crawl/quest
          include-hidden-files: true
  pages:
    name: Assemble both web targets
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [web, quest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages-ordinary
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: pages-quest
          path: site/quest
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    name: Publish GitHub Pages
    # Explicit status handling permits skipped optional jobs, but never a failed
    # build or a skipped/failed extended check that was requested for this run.
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          needs.pages.result == 'success' && needs.native.result == 'success' && needs.quality.result == 'success' &&
          ((!inputs.extended_tests && needs.coverage.result == 'skipped' && needs.sanitizer-build.result == 'skipped' &&
            needs.instrumented.result == 'skipped' && needs.web-browser.result == 'skipped') ||
           (inputs.extended_tests && needs.coverage.result == 'success' && needs.sanitizer-build.result == 'success' &&
            needs.instrumented.result == 'success' && needs.web-browser.result == 'success')) }}
    needs: [pages, native, quality, coverage, sanitizer-build, instrumented, web-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the built game
        id: deployment
        uses: actions/deploy-pages@v4
